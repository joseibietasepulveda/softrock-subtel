apiVersion: apps/v1
kind: Deployment
metadata:
  name: subtel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subtel
  template:
    metadata:
      labels:
        app: subtel
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          # Sustituir por la imagen construida y almacenada por SUBTEL.
          image: registry.example.invalid/subtel/proteccion-datos:0.6.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: subtel-config
            - secretRef:
                name: subtel-secrets
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 15
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: documentos
              mountPath: /data
      volumes:
        - name: documentos
          persistentVolumeClaim:
            claimName: subtel-documentos
